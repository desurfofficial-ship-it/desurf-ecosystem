name: desurf-contracts
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Desurf
        run: npm install -g desurf-cli@2
      - name: Run contract suites
        run: |
          mkdir -p reports
          if [ -f desurf.config.json ]; then
            desurf test --all --junit reports/desurf.xml --summary --fail-unsealed
          elif [ -d contracts ]; then
            desurf test --suite ./contracts --junit reports/desurf.xml --summary --fail-unsealed
          else
            echo "No desurf.config.json or ./contracts — skip"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desurf-junit
          path: reports/
          if-no-files-found: ignore
