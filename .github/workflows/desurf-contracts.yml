name: desurf-contracts
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Desurf
        run: npm install -g desurf-cli@2
      - name: Contract suite
        run: |
          if [ -d ./examples ]; then
            desurf test --suite ./examples --fail-unsealed || true
          fi
          if [ -d ./contracts ]; then
            desurf test --suite ./contracts --fail-unsealed
          fi
